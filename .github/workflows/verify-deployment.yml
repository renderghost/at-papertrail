name: Verify deployment

# Vercel deploys main to production on its own. After each push to main, wait
# until the domain serves that commit's build (its papertrail-build meta tag),
# then check the live site can sign people in: client metadata reachable
# without a redirect and naming itself as client_id, served by Vercel, security
# headers present, routing intact. See scripts/check-deployment.mjs.
#
# Keyed on the push rather than on Vercel's deployment events, so it doesn't
# depend on which events the Vercel GitHub integration sends.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      url:
        description: Site URL to check
        default: https://papertrail.renderg.host/

permissions:
  contents: read

# A newer push supersedes the wait: Vercel cancels the older build, and the
# older commit would never be served.
concurrency:
  group: verify-deployment
  cancel-in-progress: true

env:
  # The canonical production URL. A production deployment's own *.vercel.app URL
  # sits behind Vercel Deployment Protection, so check the domain people use.
  PRODUCTION_URL: https://papertrail.renderg.host/

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check the live site
        env:
          SITE_URL: ${{ inputs.url || env.PRODUCTION_URL }}
          EXPECT_BUILD: ${{ github.event_name == 'push' && github.sha || '' }}
        # On a push, wait up to 10 minutes (30 × 20 s) for Vercel to build and alias the commit.
        run: |
          if [ -n "$EXPECT_BUILD" ]; then
            node scripts/check-deployment.mjs "$SITE_URL" --expect-vercel --expect-build "$EXPECT_BUILD" --retries 30
          else
            node scripts/check-deployment.mjs "$SITE_URL" --expect-vercel --retries 3
          fi
