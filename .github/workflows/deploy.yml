name: Build and deploy

# Pull requests: test and build only. Pushes to main (and manual runs on main):
# test, build, publish to GitHub Pages, then check the live site can sign in.
# Step-by-step instructions: docs/deployment.md
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Each job asks for what it needs; nothing by default.
permissions: {}

concurrency:
  # One Pages deployment at a time, never cancelled half-way; superseded PR builds are cancelled.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      site_url: ${{ steps.site.outputs.url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The site URL (and so the OAuth client id) comes from the committed .env.
      - run: npm run build
      - id: site
        run: echo "url=$(grep -E '^VITE_SITE_URL=' .env | cut -d= -f2- | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    # The github-pages environment only accepts main, so don't try from anywhere else.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    # Sign-in only works if the PDS can fetch client-metadata.json at exactly
    # the URL it names as its client_id, with no redirect. Check that, plus the
    # deep-link fallback, against the live site.
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions: {}
    env:
      SITE_URL: ${{ needs.build.outputs.site_url }}
    steps:
      - name: Client metadata is served at its own client_id
        run: |
          url="${SITE_URL%/}/client-metadata.json"
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -s -o metadata.json -w '%{http_code}' "$url")
            if [ "$status" = 200 ] && [ "$(jq -r .client_id metadata.json)" = "$url" ]; then
              echo "OK: $url"
              jq . metadata.json
              exit 0
            fi
            echo "Attempt $attempt: HTTP $status; waiting for the CDN…"
            sleep 20
          done
          echo "::error::$url did not return metadata whose client_id is $url (last HTTP $status). If it redirects, the site moved (custom domain?): update VITE_SITE_URL in .env."
          exit 1
      - name: Deep links fall back to the app
        run: |
          body=$(curl -s "${SITE_URL%/}/book/bk_deploycheck")
          echo "$body" | grep -q '<div id="root">' || { echo "::error::Deep links don't serve the app (is 404.html missing?)"; exit 1; }
          echo "OK: deep links serve the app"
